version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Node.js updates require changes to .nvmrc
      - dependency-name: "@types/node"
      # majors go to feature/v5 (entry below)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    groups:
      patch-deps-updates-main:
        update-types:
          - "patch"
      minor-deps-updates-main:
        update-types:
          - "minor"
  - package-ecosystem: npm
    directory: "/"
    target-branch: feature/v5
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      major-deps-updates-v5:
        update-types:
          - "major"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "11:00"
    open-pull-requests-limit: 10
    groups:
      patch-deps-updates:
        update-types:
          - "patch"
      minor-deps-updates:
        update-types:
          - "minor"
      major-deps-updates:
        update-types:
          - "major"
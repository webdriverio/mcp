name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          # the runner cache can hold a 24.x below the engines floor
          check-latest: true
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Fetch Docs Corpus
        run: curl -sfL https://webdriver.io/llms-full.txt --create-dirs -o "$HOME/.wdio-mcp/llms-full.txt" && test -s "$HOME/.wdio-mcp/llms-full.txt"

      - name: Run Tests
        run: pnpm test
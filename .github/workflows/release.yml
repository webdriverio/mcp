name: Manual NPM Publish

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Release type - major, minor or patch"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
      distTag:
        description: 'NPM tag (e.g. use "next" to release a test version)'
        required: true
        default: "latest"
      dev:
        description: 'Dev build: publish <next version>-dev.<run> under the "dev" tag, without release commit, git tag, changelog or GitHub release'
        type: boolean
        default: false

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Git
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run bundle

      - name: Release
        if: ${{ !inputs.dev }}
        run: npx release-it ${{github.event.inputs.releaseType}} --ci --no-git.requireCleanWorkingDir --npm.tag=${{github.event.inputs.distTag}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_REGISTRY: https://registry.npmjs.org/

      # no GitHub release on purpose: it would publish the build to the MCP registry
      - name: Publish dev build
        if: ${{ inputs.dev }}
        run: |
          VERSION="$(node -e '
            const [major, minor, patch] = require("./package.json").version.split(/[.-]/).map(Number)
            const next = { major: [major + 1, 0, 0], minor: [major, minor + 1, 0], patch: [major, minor, patch + 1] }[process.env.RELEASE_TYPE]
            console.log(`${next.join(".")}-dev.${process.env.GITHUB_RUN_NUMBER}`)
          ')"
          npm version "$VERSION" --no-git-tag-version
          npm publish --tag dev
          echo "Published @wdio/mcp@$VERSION (npm tag: dev)" >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_TYPE: ${{ inputs.releaseType }}
